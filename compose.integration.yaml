services:
  postgres:
    image: postgres:17
    container_name: cast-integration-postgres
    ports:
      - "127.0.0.1:15433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?required}
      POSTGRES_DB: cast_integration_test
      CAST_DB_PASSWORD: ${CAST_DB_PASSWORD:?required}
      CAST_AI_DB_PASSWORD: ${CAST_AI_DB_PASSWORD:?required}
      CAST_MIGRATION_DB_PASSWORD: ${CAST_MIGRATION_DB_PASSWORD:?required}
    volumes:
      - cast_integration_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cast_integration_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  cast_integration_postgres_data:
